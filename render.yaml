services:
  - type: web
    name: bisu-bilar-td-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_HOST
        value: 194.59.164.40
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: u463580331_td_db
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:4321,https://yourdomain.hostinger.com
      - key: ENVIRONMENT
        value: production
